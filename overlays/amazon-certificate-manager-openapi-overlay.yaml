overlay: 1.0.0
info:
  title: API Evangelist enhancements for Amazon Certificate Manager API
  version: 1.0.0
extends: openapi/amazon-certificate-manager-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: amazon-certificate-manager
    x-apievangelist-tags:
    - AWS
    - Certificates
    - Encryption
    - Security
    - SSL
    - TLS
    x-apievangelist-auth: aws-sigv4
    x-apievangelist-llms-txt: https://docs.aws.amazon.com/acm/latest/APIReference/llms.txt
- target: $.info
  update:
    x-apievangelist-security-txt: https://aws.amazon.com/.well-known/security.txt
- target: $.paths['/'].post
  update:
    x-apievangelist-idempotent: true
    x-apievangelist-note: >-
      RequestCertificate accepts an IdempotencyToken to safely retry certificate
      requests without creating duplicates.
- target: $.paths['/certificates'].get
  update:
    x-apievangelist-pagination:
      style: token
      request_param: nextToken
      response_field: NextToken
      page_size_param: maxItems
